<!DOCTYPE html>
<html lang="sw">

<head>
  <meta charset="UTF-8">
  <title>Kibubu M-Pesa Test Dashboard</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0d1117;
      color: #c9d1d9;
      margin: 0;
      padding: 24px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 650px;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }

    h1 {
      margin-top: 0;
      color: #58a6ff;
      font-size: 1.5rem;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .badge {
      font-size: 0.75rem;
      padding: 3px 8px;
      background: #238636;
      color: #fff;
      border-radius: 999px;
    }

    label {
      display: block;
      margin-top: 14px;
      margin-bottom: 6px;
      font-size: 0.9rem;
      color: #8b949e;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 10px 12px;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 6px;
      color: #c9d1d9;
      font-size: 1rem;
    }

    input:focus {
      outline: none;
      border-color: #58a6ff;
    }

    .btn-group {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    button {
      flex: 1;
      padding: 12px;
      border-radius: 6px;
      border: none;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.95rem;
    }

    .btn-primary {
      background: #238636;
      color: #ffffff;
    }

    .btn-primary:hover {
      background: #2ea043;
    }

    .btn-secondary {
      background: #21262d;
      color: #58a6ff;
      border: 1px solid #30363d;
    }

    .btn-secondary:hover {
      background: #30363d;
    }

    pre {
      margin-top: 20px;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 14px;
      font-family: Consolas, monospace;
      font-size: 0.85rem;
      overflow-x: auto;
      max-height: 250px;
      color: #7ee787;
    }

    .status-pill {
      display: inline-block;
      margin-top: 10px;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.85rem;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>Kibubu M-Pesa Test Center <span class="badge">SANDBOX</span></h1>
    <p style="color:#8b949e; font-size:0.9rem;">Fanya majaribio ya M-Pesa STK Push moja kwa moja.</p>

    <label for="phone">Nambari ya Simu (M-Pesa format: 2557XXXXXXXX au 2547XXXXXXXX)</label>
    <input type="tel" id="phone" name="phone" inputmode="numeric" autocomplete="tel"
      aria-describedby="phone-hint" value="255712345678" />
    <small id="phone-hint" style="color: #8b949e; display:block; margin-top:4px;">Kumbuka: Kwenye Sandbox mode, namba yoyote ya test ya
      Tanzania (<code>255...</code>) inabadilishwa kuwa <code>254708374149</code> kiotomatiki na server ili kuzuia
      hitilafu ya Daraja Sandbox.</small>

    <label for="amount">Kiasi (TZS)</label>
    <input type="number" id="amount" name="amount" min="1" max="150000" step="1" inputmode="numeric" value="1000" />

    <label for="ref">Kumbukumbu ya Malipo (Account Reference)</label>
    <input type="text" id="ref" name="accountReference" maxlength="20" autocomplete="off" value="KIBUBU_TEST" />

    <div class="btn-group">
      <button class="btn-secondary" onclick="checkHealth()">1. Check Health (/health)</button>
      <button class="btn-primary" onclick="sendStkPush()">2. Tuma STK Push</button>
    </div>

    <div id="status" role="status" aria-live="polite"></div>
    <pre id="log" aria-live="polite">// Matokeo ya test yataonekana hapa...</pre>
  </div>

  <script>
    const logEl = document.getElementById('log');
    const statusEl = document.getElementById('status');

    // Rangi za status pill zilizokuwa zikijirudia mara nyingi.
    const PILL = {
      ok: 'background:#238636;color:white',
      bad: 'background:#da3633;color:white',
      wait: 'background:#d29922;color:black'
    };

    function showStatus(message, kind) {
      statusEl.innerHTML = '';
      const span = document.createElement('span');
      span.className = 'status-pill';
      span.setAttribute('style', PILL[kind] || PILL.ok);
      span.textContent = message;
      statusEl.appendChild(span);
    }

    // Server inaweza kurudisha HTML (mfano ukurasa wa 404 wa Express) badala ya
    // JSON. Tusipolinda, res.json() inatupa SyntaxError na mtumiaji anaona
    // "Network Error" ya uongo ingawa server ilijibu.
    async function readResponse(res) {
      const raw = await res.text();
      try {
        return { data: JSON.parse(raw), text: raw };
      } catch {
        return { data: null, text: raw };
      }
    }

    // Hutafuta ujumbe wa kosa kwenye majibu ya namna mbalimbali.
    function errorMessage(data, res, raw) {
      if (data && typeof data === 'object') {
        if (typeof data.error === 'string' && data.error) return data.error;
        if (typeof data.ResultDesc === 'string' && data.ResultDesc) return data.ResultDesc;
        if (typeof data.CustomerMessage === 'string' && data.CustomerMessage) return data.CustomerMessage;
      }
      if (raw) {
        const stripped = raw.split('<').map(function (chunk) {
          const end = chunk.indexOf('>');
          return end === -1 ? chunk : chunk.slice(end + 1);
        }).join(' ').split(/\s+/).join(' ').trim();
        if (stripped) return stripped.slice(0, 200);
      }
      return 'Server ilijibu kwa HTTP ' + res.status + ' bila maelezo.';
    }

    async function checkHealth() {
      logEl.textContent = 'Inapima Server Health...';
      try {
        const res = await fetch('/health');
        const { data, text } = await readResponse(res);
        logEl.textContent = data ? JSON.stringify(data, null, 2) : text;
        if (res.ok && data && data.ok === true) {
          showStatus('Server ipo hewani (OK)', 'ok');
        } else {
          showStatus('Server imejibu HTTP ' + res.status, 'bad');
        }
      } catch (e) {
        logEl.textContent = 'Hitilafu: ' + e.message;
        showStatus('Imeshindwa kufikia server', 'bad');
      }
    }

    async function sendStkPush() {
      const phoneNumber = document.getElementById('phone').value.trim();
      const accountReference = document.getElementById('ref').value.trim();
      const amountRaw = document.getElementById('amount').value.trim();

      // Number('') ni 0 na Number('abc') ni NaN. Server inazikataa zote mbili,
      // hivyo tuonyeshe kosa wazi kabla ya kutuma ombi.
      const amount = Number(amountRaw);
      if (!amountRaw || !Number.isInteger(amount) || amount <= 0) {
        logEl.textContent = 'Kiasi lazima kiwe nambari kamili kubwa kuliko 0.';
        showStatus('Kiasi batili', 'bad');
        return;
      }
      if (amount > 150000) {
        logEl.textContent = 'Kiasi kikubwa kupita kiasi. Kiwango cha juu ni TZS 150000.';
        showStatus('Kiasi kikubwa mno', 'bad');
        return;
      }
      if (!phoneNumber) {
        logEl.textContent = 'Tafadhali jaza nambari ya simu.';
        showStatus('Nambari ya simu haipo', 'bad');
        return;
      }

      logEl.textContent = 'Inatuma ombi la STK Push kwenda Safaricom Sandbox...';
      showStatus('Inatuma ombi...', 'wait');

      try {
        const res = await fetch('/api/v1/stkpush', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
          body: JSON.stringify({ phoneNumber, amount, accountReference })
        });
        const { data, text } = await readResponse(res);

        if (res.ok) {
          logEl.textContent = data
            ? JSON.stringify(data, null, 2)
            : text;
          showStatus('Ombi Limekubaliwa! Status: ' + res.status, 'ok');
        } else {
          // Kosa linajirudia kwenye JSON na kwenye ujumbe uliotolewa. Onyesha
          // JSON kamili ikiwa ni sahihi, vinginevyo ujumbe uliosafishwa tu.
          logEl.textContent = data
            ? JSON.stringify(data, null, 2)
            : errorMessage(data, res, text);
          showStatus('Hitilafu! Status: ' + res.status, 'bad');
        }
      } catch (e) {
        logEl.textContent = 'Hitilafu ya mtandao au server: ' + e.message;
        showStatus('Network Error', 'bad');
      }
    }
  </script>
</body>

</html>
